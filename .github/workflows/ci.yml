name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job runs on its own fresh machine, so each one checks out the code and installs uv again.
# The jobs run side by side, and a red job's name tells you which kind of problem it is.
jobs:
  lint:
    # Checks the code style and finds common mistakes (ruff), so the code stays easy to read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  types:
    # Checks the type hints (mypy, strict), which catch many bugs before the code ever runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --locked mypy

  test:
    # Runs every test that needs no internet. If this is red, a change broke behaviour.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m "not network"

  network:
    # Downloads Apple's published API spec and checks that every endpoint we use still exists.
    # It can go red when Apple's site is down or slow, with no change in our code: run it again
    # before assuming the code is wrong. It does not call the App Store Connect API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m network

  audit:
    # Fails when a dependency in uv.lock has a known vulnerability (OSV / PyPI advisories), so a
    # vulnerable library cannot reach users unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit==2.10.1 --requirement requirements-audit.txt --no-deps --disable-pip
