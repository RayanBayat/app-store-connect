[project]
name = "asc-mcp-maintenance"
version = "0.1.0"
description = "Keeps the App Store Connect MCP server current and safe (review gate + helper scripts)."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
