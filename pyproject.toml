[project]
name = "app-store-connect"
version = "0.1.0"
description = "App Store Connect in Claude, safely: an MCP server for Apple's App Store Connect API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
app-store-connect = "app_store_connect.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "PTH", "RET",
    "ARG", "PLC0415",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S105", "S106", "S108", "ARG001", "ARG002"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m 'not network'"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: downloads Apple's published OpenAPI spec (deselected by default)"]
